version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    assignees:
      - "mfridman"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups:
      gomod:
        patterns:
          - "*"
    assignees:
      - "mfridman"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # Pinned to the versions modernc.org/sqlite requires. Updating sqlite
      # moves them. See scripts/go-deps.sh.
      - dependency-name: "modernc.org/libc"
      - dependency-name: "modernc.org/mathutil"
      - dependency-name: "modernc.org/memory"
