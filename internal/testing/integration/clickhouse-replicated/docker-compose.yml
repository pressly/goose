version: "3.9"

# Two-node replicated ClickHouse cluster with ClickHouse Keeper, sufficient to
# exercise the goose `clickhouse-replicated` dialect end-to-end.
#
# Not wired into CI. Bring it up locally with:
#
#   docker compose -f docker-compose.yml up -d
#
# Then run migrations with (for example):
#
#   GOOSE_CLICKHOUSE_CLUSTER=goose_cluster \
#     goose -dir ./migrations \
#           clickhouse-replicated \
#           "clickhouse://default@localhost:9000/default" up
#
# ClickHouse Keeper runs embedded in ch1 (single-node quorum) for simplicity.

services:
  ch1:
    image: clickhouse/clickhouse-server:24.8
    hostname: ch1
    container_name: goose-ch1
    ports:
      - "9000:9000"
      - "8123:8123"
    environment:
      CLICKHOUSE_SHARD: "1"
      CLICKHOUSE_REPLICA: "ch1"
    volumes:
      - ./config/ch1.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/macros-ch1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30

  ch2:
    image: clickhouse/clickhouse-server:24.8
    hostname: ch2
    container_name: goose-ch2
    ports:
      - "9001:9000"
      - "8124:8123"
    environment:
      CLICKHOUSE_SHARD: "1"
      CLICKHOUSE_REPLICA: "ch2"
    volumes:
      - ./config/ch2.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/macros-ch2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/keeper-client.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    depends_on:
      ch1:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30
